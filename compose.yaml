# Regista on one PC: the page and the service in one container, the models in Ollama on the host.
# Start it with .\run.ps1, which also measures the computer and passes it in.
services:
  regista:
    # the image takes the name of the folder Regista is in: two of them on one PC do not mix
    build: .
    ports:
      # this computer's door: only this PC can reach it
      - "127.0.0.1:${PAGE_PORT:-8090}:8000"
      # the door of the phones: encrypted, and it lets in only a phone that was paired from
      # this PC. Closed to the network unless the app is started with .\run.ps1 -Phone
      - "${PHONE_BIND:-127.0.0.1}:${PHONE_HOST_PORT:-8443}:8443"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      PHONE_OPEN: ${PHONE_OPEN:-0}
      # the port a phone knocks at, written in the link that pairs it
      PHONE_PUBLIC_PORT: ${PHONE_HOST_PORT:-8443}
      # where a phone finds this PC on the network, and what the PC is called
      HOST_ADDRESSES: ${HOST_ADDRESSES:-}
      HOST_NAME: ${HOST_NAME:-}
      HOST_GPU_NAME: ${HOST_GPU_NAME:-}
      HOST_GPU_MB: ${HOST_GPU_MB:-0}
      # "nvidia", or "other" for a card Ollama may or may not use
      HOST_GPU_KIND: ${HOST_GPU_KIND:-}
      HOST_RAM_MB: ${HOST_RAM_MB:-0}
      HOST_CORES: ${HOST_CORES:-0}
      # the folder as the user knows it, to show it in the page
      PHOTOS_LABEL: ${PHOTOS_DIR:-foto}
    # What the app may do in its container, and no more: it writes only its index, the pictures'
    # folder and /tmp, it cannot gain rights it was not started with, and it has none of the
    # special powers of a system's administrator. Whatever went wrong in it would stay small.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # the pictures. The app never deletes one: it can move them to its trash, inside this same
      # folder, and copy them, and both only when the user says yes. Started with
      # .\run.ps1 -ReadOnly it can only look at them, and it is Docker that enforces it.
      - type: bind
        source: ${PHOTOS_DIR:-./foto}
        target: /photos
        read_only: ${PHOTOS_READ_ONLY:-false}
      # fingerprints of the pictures, small copies for the page, results of the model tests
      - index:/data
      # the models the phone app runs by itself, for a paired phone to take: read only
      - type: bind
        source: ./models
        target: /models
        read_only: true
        bind:
          create_host_path: true

volumes:
  index:
